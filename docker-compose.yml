services:
    mysql:
        image: mysql:8.3
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
            MYSQL_DATABASE: ${MYSQL_DATABASE:-symfony_db}
            MYSQL_USER: ${MYSQL_USER:-symfony_user}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:-symfony_pass}
        ports:
            - "3306:3306"
        command: --default-authentication-plugin=mysql_native_password
        volumes:
            - mysql_data:/var/lib/mysql

    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        depends_on:
            - mysql
        environment:
            APP_ENV: ${APP_ENV:-dev}
            APP_DEBUG: ${APP_DEBUG:-1}
            DATABASE_URL: ${DATABASE_URL:-mysql://symfony_user:symfony_pass@mysql:3306/symfony_db?serverVersion=8.0}
        working_dir: /var/www/symfony
        volumes:
            - ./www:/var/www/symfony
            - symfony_var:/var/www/symfony/var
            - symfony_php_logs:/usr/local/var/log
        ports:
            - "9000:9000"
        expose:
            - "9000"

    nginx:
        image: nginx:1.25-alpine
        restart: unless-stopped
        depends_on:
            - php
        ports:
            - "80:80"
        volumes:
            - ./www:/var/www/symfony:ro
            - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
            - ./docker/nginx/logs:/var/log/nginx

    elasticsearch:
        image: elastic/elasticsearch:9.2.4
        restart: unless-stopped
        environment:
            - discovery.type=single-node # config es pour fonctionner comme un noeud unique sans clustering
            - xpack.security.enabled=false # desac xpack security
            - ES_JAVA_OPTS=-Xms1g -Xmx1g # config la memoire jvm a 1go
        ports:
            - "9200:9200"
        volumes:
            - es_data:/usr/share/elasticsearch/data

    logstash:
        image: elastic/logstash:9.2.4
        restart: unless-stopped
        depends_on:
            - elasticsearch
        ports:
            - "5044:5044"
            - "9600:9600"
        environment:
            - LS_JAVA_OPTS=-Xms512m -Xmx512m
        volumes:
            - ./docker/logstash/pipeline:/usr/share/logstash/pipeline:ro

    kibana:
        image: elastic/kibana:9.2.4
        restart: unless-stopped
        depends_on:
            - elasticsearch
        environment:
            - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
            - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
        ports:
            - "5601:5601"

    filebeat:
        image: elastic/filebeat:9.2.4
        restart: unless-stopped
        depends_on:
            - logstash
        user: root
        command: ["filebeat", "-e", "--strict.perms=false"] # filebeat en mode verbose et desac les verif de perms strictes (filebeat fonctionne mm sans les perms restrictives)
        volumes:
            - ./docker/nginx/logs:/var/log/nginx:ro
            - ./docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
            - filebeat_data:/usr/share/filebeat/data

volumes:
    mysql_data:
    symfony_var:
    symfony_php_logs:
    es_data:
    filebeat_data:
